[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `doubleblind-audit`; the import name and the repository
# stay `doubleblind`. The bare name on PyPI belongs to an unrelated project -
# a filename randomiser - so publishing under it is impossible and telling
# anyone to `pip install doubleblind` installs somebody else's package.
name = "doubleblind-audit"
version = "0.1.0"
description = "Three layers that cannot see each other's mistakes: re-derive every number in prose from a committed file, brief a reviewer that was told nothing, and audit the figure a reader will actually see."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Guo Cheng"}]
keywords = ["agents", "verification", "reproducibility", "review", "llm", "research", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  # CI runs 3.9 and 3.13, each against the oldest supported matplotlib and the
  # newest. PyPI filters on these, and a package that lists none is a package
  # nobody can filter to.
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# The two core layers are standard library only. The figure layer needs a
# renderer, and that is the only reason to install anything.
# 3.9 is the oldest release tested, and the oldest with wheels for the Python
# versions this is tested on. 3.5-3.8 were built against numpy 1 and produce
# `_ARRAY_API not found` next to a current numpy - a floor nobody exercises is
# a claim with no evidence behind it, which is the thing this package is about.
render = ["matplotlib>=3.9"]

[project.urls]
Homepage = "https://github.com/GuoCheng24/doubleblind"
Ledger = "https://github.com/GuoCheng24/doubleblind/tree/main/ledger"
Protocol = "https://github.com/GuoCheng24/doubleblind/tree/main/protocol"
Source = "https://github.com/GuoCheng24/doubleblind"
Issues = "https://github.com/GuoCheng24/doubleblind/issues"

[project.scripts]
doubleblind = "doubleblind.cli:main"

[tool.setuptools]
packages = ["doubleblind"]
